server {
    listen 80;
    server_name cides06.gm.fh-koeln.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name cides06.gm.fh-koeln.de;

    ssl_certificate /etc/ssl/certs/palpalette.crt;
    ssl_certificate_key /etc/ssl/private/palpalette.key;
    
    # iOS and ESP32-compatible SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # iOS-compatible cipher suites (prioritize ECDHE with strong encryption)
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    
    # iOS-compatible curves
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    
    # SSL session configuration
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling (helps with iOS certificate validation)
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers for better iOS compatibility
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Swagger API Documentation at /api
    location /api {
        proxy_pass http://backend:3000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # API routes (auth, users, devices, etc.)
    location ~ ^/(auth|users|devices|messages|push)/ {
        proxy_pass http://backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Handle root path - redirect to API docs
    location = / {
        return 301 https://$server_name/api;
    }

    # WebSocket (WS → WSS)
    location /ws {
        proxy_pass http://backend:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}