version: "3.8"
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palpalette
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    command: >
      postgres -c timezone=Europe/Berlin

  backend:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    # Internal ports only - Nginx will handle external access
    expose:
      - "3000" # REST API
      - "3001" # WebSocket
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80" # HTTP (redirects to HTTPS)
      - "443:443" # HTTPS
      - "3001:3001" # WSS for ESP32 devices
    volumes:
      - ./nginx.conf/palpalette.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl:ro # SSL certificates
    depends_on:
      - backend

volumes:
  postgres_data:
